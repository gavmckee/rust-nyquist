services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: nyquist-vm
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:8428
      - --retentionPeriod=7d
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: nyquist-ch
    ports:
      - "18123:8123"   # HTTP interface (host 18123 → container 8123; host 8123 may be native CH)
      - "19000:9000"   # Native protocol
    environment:
      CLICKHOUSE_DB: nyquist
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: nyquist-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous admin access — local dev only, do not expose port 3000 publicly.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - victoriametrics
      - clickhouse
    restart: unless-stopped

  nyquist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyquist
    # Share the host PID namespace so /proc reflects host-level metrics, not
    # container-level metrics.
    pid: "host"
    ports:
      - "9100:9100"
    volumes:
      - ./docker/nyquist.toml:/etc/nyquist/config.toml:ro
    command: ["--config", "/etc/nyquist/config.toml"]
    depends_on:
      victoriametrics:
        condition: service_healthy
    restart: unless-stopped
    # To enable perf counters, add:
    #   cap_add: [PERFMON]

volumes:
  vm-data:
  ch-data:
  grafana-data:
