[package]
name = "nyquist-core"
version = "0.1.0"
edition = "2021"

[dependencies]
histogram = "0.11"
dashmap = "6"
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "test-util"] }
