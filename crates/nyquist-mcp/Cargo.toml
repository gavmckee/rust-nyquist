[package]
name = "nyquist-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing nyquist telemetry + encoded troubleshooting knowledge to Claude"

[[bin]]
name = "nyquist-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow = "1"
