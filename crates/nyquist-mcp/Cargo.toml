[package]
name = "nyquist-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server exposing nyquist telemetry + encoded troubleshooting knowledge to Claude"

[[bin]]
name = "nyquist-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
