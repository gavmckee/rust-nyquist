[package]
name = "nyquist-recorder"
version = "0.1.0"
edition = "2021"

[dependencies]
nyquist-core = { path = "../nyquist-core" }
arrow-array  = "53"
arrow-schema = "53"
parquet      = { version = "53", default-features = false, features = ["snap", "arrow"] }
async-trait  = "0.1"
thiserror    = "1"
tracing      = "0.1"

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
