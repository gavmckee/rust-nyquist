[package]
name = "nyquist-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive explorer for Nyquist Parquet recordings"

[dependencies]
nyquist-core = { workspace = true }
parquet = { workspace = true, features = ["snap", "arrow"] }
arrow-array = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }

[dev-dependencies]
nyquist-recorder = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
