[package]
name = "nyquist-clickhouse"
version = "0.1.0"
edition = "2021"

[dependencies]
nyquist-core = { path = "../nyquist-core" }
nyquist-sysconfig = { path = "../nyquist-sysconfig" }
clickhouse   = "0.13"
async-trait  = "0.1"
thiserror    = "1"
tracing      = "0.1"
serde_json   = "1"
tokio        = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
clickhouse-integration = []
