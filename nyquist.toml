[general]
listen = "0.0.0.0:9100"
default_interval = "10ms"
window = "60s"
percentiles = [50.0, 90.0, 99.0, 99.9]

[victoria_metrics]
enabled = true
url = "http://localhost:8428"
push_interval = "10s"

[clickhouse]
enabled = true
url = "http://localhost:18123"
database = "nyquist"
username = "default"
password = ""
insert_interval = "10s"

[perf]
enabled = true
max_cpus = 0
hw_enabled = true
sw_enabled = true

# BPF cpu/usage replaces procfs cpu — disable procfs sampler to avoid scale conflict.
[samplers.cpu]
enabled = false

[samplers."cpu/usage"]
enabled = true

[samplers.network]
enabled = false

[samplers."network/traffic"]
enabled = true

[samplers."tcp/packet_latency"]
enabled = true

[samplers."tcp/retransmit"]
enabled = true

[samplers.disk]
enabled = false

[samplers."disk/blockio"]
enabled = true
