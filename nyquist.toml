[general]
listen = "0.0.0.0:9100"
default_interval = "10ms"
window = "60s"
percentiles = [50.0, 90.0, 99.0, 99.9]

[victoria_metrics]
enabled = true
url = "http://localhost:8428"
push_interval = "10s"

[clickhouse]
enabled = true
url = "http://localhost:18123"
# Match the docker/docker-compose.yml stack (and where Grafana + the MCP
# server look): db nyquist_live, password from CLICKHOUSE_PASSWORD.
database = "nyquist_live"
username = "default"
password = "nyquist"
insert_interval = "10s"

[syswatch]
enabled = true

[perf]
enabled = true
max_cpus = 0
hw_enabled = true
sw_enabled = true

# BPF cpu/usage replaces procfs cpu — disable procfs sampler to avoid scale conflict.
[samplers.cpu]
enabled = false

[samplers."cpu/usage"]
enabled = true

[samplers."cpu/vtime"]
enabled = true

# procfs network stays ENABLED: the eBPF network/traffic sampler deliberately
# does not count bytes (GRO batching aliased them past line rate), so procfs
# is the only source of network_receive/transmit_bytes — which dashboards and
# the MCP query_bandwidth tool depend on.
[samplers.network]
enabled = true

[samplers."network/traffic"]
enabled = true

[samplers."tcp/packet_latency"]
enabled = true

[samplers."tcp/retransmit"]
enabled = true

[samplers.disk]
enabled = false

[samplers."disk/blockio"]
enabled = true
