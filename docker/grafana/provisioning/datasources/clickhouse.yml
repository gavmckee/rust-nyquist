apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    uid: nyquist-clickhouse
    isDefault: false
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      username: default
      defaultDatabase: nyquist
      protocol: native
    secureJsonData:
      password: ""
