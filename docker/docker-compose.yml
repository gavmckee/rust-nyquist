services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: nyquist-vm
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
    command:
      - -retentionPeriod=1
      - -storageDataPath=/storage
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: nyquist-ch
    ports:
      - "18123:8123"   # HTTP interface — nyquist pushes from host to localhost:18123
      - "9000:9000"    # Native TCP — Grafana connects via clickhouse:9000 internally
    environment:
      CLICKHOUSE_PASSWORD: nyquist
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: nyquist-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous admin access — local dev only, do not expose port 3000 publicly.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PATHS_PLUGINS: /grafana-plugins
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - victoriametrics
    restart: unless-stopped


volumes:
  vm-data:
  grafana-data:
  ch-data:
